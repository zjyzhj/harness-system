<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:;" />
<title>Pet</title>
<link rel="stylesheet" href="./pet.css" />
</head>
<body>
<div id="pet" class="draggable">
  <div id="pet-avatar">
    <span id="pet-sprite">🤖</span>
    <span id="pet-mood-badge">🙂</span>
  </div>
  <div id="pet-name"></div>
  <div id="pet-status" class="status-idle"></div>
</div>
<div id="bubble" class="bubble hidden">
  <div id="bubble-text"></div>
  <div id="bubble-actions" class="bubble-actions hidden">
    <button id="bubble-open" class="bubble-btn">📂 查看完整会话</button>
    <button id="bubble-close" class="bubble-btn">✕</button>
  </div>
  <textarea id="bubble-input" placeholder="发消息…"></textarea>
  <button id="bubble-send">发送</button>
</div>
<script src="./common-render.js"></script>
<script src="./pet.js"></script>
</body>
</html>
